name: Windows cloud build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cloud-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      VCPKG_MAX_CONCURRENCY: '2'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Check out the selected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set runner-local Pub cache
        run: '"PUB_CACHE=$env:RUNNER_TEMP\rd-cl-pub-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Test build guards
        run: ./scripts/tests/windows-cloud-build.tests.ps1

      - name: Set up Python for the portable packer
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Reuse SDK and dependency caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}\rd-cl-tools
            ${{ runner.temp }}\rd-cl-pub-cache
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
            target
          key: windows-2022-rd-cl-${{ hashFiles('Cargo.lock', 'flutter/pubspec.lock', 'vcpkg.json', 'scripts/windows-cloud-build.json', 'scripts/windows-cloud-requirements.txt', 'scripts/windows-cloud-build.ps1') }}
          restore-keys: |
            windows-2022-rd-cl-

      - name: Build and verify Windows x64 packages
        run: |
          ./scripts/windows-cloud-build.ps1 `
            -SourceDir $env:GITHUB_WORKSPACE `
            -BuildBase "${{ runner.temp }}\rd-cl-build" `
            -ToolsRoot "${{ runner.temp }}\rd-cl-tools" `
            -ExpectedCommit '${{ github.sha }}'

      - name: Upload verified unsigned test packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ExantasSupport-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}\rd-cl-build\artifacts\*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\rd-cl-build\windows-build.log
            ${{ runner.temp }}\rd-cl-tools\vcpkg\buildtrees\**\*.log
          if-no-files-found: ignore
          retention-days: 7
